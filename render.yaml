# Render Blueprint for ALPS CRM: one always-on web service plus its own
# PostgreSQL, both in Frankfurt, separate from ComplyTrack.
#
# Cost: web "starter" ($7/month) and Postgres "basic-256mb" ($6/month) are
# Render's cheapest plans that stay on (free web services sleep and free
# databases expire after 30 days). About £10-11 a month in total.
#
# The app applies its own database migrations when it starts, so there is no
# separate set-up step: build, then start.

services:
  - type: web
    name: alps-crm
    runtime: node
    region: frankfurt
    plan: starter
    autoDeploy: true
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.ts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: alps-crm-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Needed once, to create the owner account at /setup. Copy it from the
      # Environment page.
      - key: SETUP_TOKEN
        generateValue: true
      # Lets the Mac fetch a nightly backup (scripts/mac-backup.sh).
      - key: BACKUP_TOKEN
        generateValue: true
      # The address people use, e.g. https://crm.alpsconsultancy.co.uk. Until
      # set, links use Render's onrender.com address.
      - key: PUBLIC_APP_URL
        sync: false
      # Email (Resend): task emails, document requests and visit invites.
      # Without these the CRM works but sends nothing.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false

databases:
  - name: alps-crm-db
    databaseName: alpscrm
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
    # Only Render services may connect; no public access.
    ipAllowList: []
